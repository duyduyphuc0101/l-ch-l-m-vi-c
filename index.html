<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌿 Nhật Ký Công Việc & Thu Chi 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --primary-bg: #e8f5e9;
            --primary-border: #c8e6c9;
            --income: #1565c0;
            --income-bg: #e3f2fd;
            --income-border: #bbdefb;
            --expense: #c62828;
            --expense-bg: #ffebee;
            --expense-border: #ffcdd2;
            --text-main: #2c3e50;
            --text-muted: #64748b;
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 24px 16px;
            background: linear-gradient(135deg, #e0f2f1 0%, #e8f5e9 50%, #c8e6c9 100%);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }
        
        .container {
            max-width: 1220px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            padding: 28px 32px;
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 40px rgba(46, 125, 50, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 2px solid var(--primary-bg);
            flex-wrap: wrap;
            gap: 16px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left h2 {
            margin: 0;
            font-weight: 700;
            font-size: 24px;
            color: var(--primary);
            min-width: 210px;
            text-align: center;
        }
        
        /* BUTTONS */
        .btn {
            height: 40px;
            padding: 0 18px;
            border: 1.5px solid var(--primary-border);
            background-color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            color: var(--primary);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn:hover {
            background-color: var(--primary-bg);
            border-color: #81c784;
            transform: translateY(-2px);
        }
        .btn-icon-nav {
            width: 40px;
            padding: 0;
            border-radius: 50%;
            font-size: 16px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #66bb6a 0%, #2e7d32 100%);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.25);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4caf50 0%, #1b5e20 100%);
            color: white;
        }
        .btn-small {
            height: 32px;
            padding: 0 12px;
            font-size: 12px;
            border-radius: 10px;
        }
        .btn-danger {
            width: 38px;
            height: 38px;
            padding: 0;
            flex-shrink: 0;
            background-color: var(--expense-bg);
            color: var(--expense);
            border: 1px solid var(--expense-border);
            border-radius: 10px;
            font-size: 14px;
        }
        .btn-danger:hover {
            background-color: var(--expense-border);
            color: #b71c1c;
            transform: scale(1.05);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .save-badge {
            font-size: 13px;
            color: var(--primary);
            background: var(--primary-bg);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            transition: opacity 0.3s;
        }

        /* CALENDAR GRID - Chuẩn 7 cột bằng nhau tuyệt đối */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 28px;
        }
        .weekday {
            text-align: center;
            padding: 10px 0;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-bg);
            border-radius: 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .day {
            background-color: white;
            min-height: 135px;
            padding: 8px;
            cursor: pointer;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            border: 1.5px solid #eef2f6;
            overflow: hidden;
        }
        .day:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.15);
            border-color: #81c784;
            z-index: 2;
        }
        
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .day-number {
            font-size: 13px;
            font-weight: 700;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--text-main);
            background: #f8fafc;
        }
        .today {
            border-color: var(--primary-light);
            background-color: #f9fef9;
        }
        .today .day-number {
            background: linear-gradient(135deg, #66bb6a 0%, #2e7d32 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
        }
        .other-month {
            opacity: 0.45;
            background-color: #f8fafc;
        }

        /* NỘI DUNG Ô NGÀY */
        .work-status-container {
            flex-grow: 1;
            border-radius: 10px;
            padding: 6px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }
        
        .slot-full { background-color: #dcedc8; color: #1b5e20; border: 1px solid #c5e1a5; }
        .slot-full.overtime { background-color: #c8e6c9; color: #1b5e20; border: 1.5px solid #4caf50; }
        .slot-half-am { background: linear-gradient(to bottom, #dcedc8 50%, #ffffff 50%); border: 1.5px solid #aed581; color: #1b5e20; }
        .slot-half-pm { background: linear-gradient(to top, #dcedc8 50%, #ffffff 50%); border: 1.5px solid #aed581; color: #1b5e20; }
        .slot-off { background-color: #f8fafc; border: 1.5px dashed #cbd5e1; color: #64748b; }
        .slot-expense-only { background-color: #fff; border: 1.5px solid var(--expense-border); }
        .slot-income-only { background-color: #fff; border: 1.5px solid var(--income-border); }
        .slot-both-only { background-color: #fff; border: 1.5px solid #b2dfdb; }
        .slot-task-only { background-color: #f8fafc; border: 1.5px dashed #81c784; color: var(--primary); }

        .status-text {
            font-weight: 700;
            text-align: center;
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.65);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ot-time-badge {
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            color: #1b5e20;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 4px;
            padding: 1px 4px;
        }

        .badges-wrap {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .income-badge, .expense-badge {
            font-size: 10.5px;
            font-weight: 700;
            text-align: center;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .income-badge {
            background-color: var(--income-bg);
            color: var(--income);
            border: 1px solid var(--income-border);
        }
        .expense-badge {
            background-color: var(--expense-bg);
            color: var(--expense);
            border: 1px solid var(--expense-border);
        }

        .job-content-preview {
            padding: 4px 6px;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.35;
            margin-top: auto;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 6px;
            color: var(--text-main);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .job-task-item {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* THỐNG KÊ (DASHBOARD) */
        .stats-panel {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px;
            border: 1.5px solid var(--primary-border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .stats-panel h3 {
            margin: 0 0 20px 0;
            color: var(--primary);
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--primary-bg);
            padding-bottom: 12px;
        }
        
        /* 4 thẻ công việc trên 1 hàng */
        .work-stat-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: #f8fafc;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1.5px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-title {
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-size: 13.5px;
        }
        .stat-val {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Bảng cân đối Thu - Chi */
        .balance-box {
            background: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 100%);
            border: 1.5px solid #a5d6a7;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .balance-header {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .balance-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .balance-card {
            background: white;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        /* 2 cột Thu Nhập & Chi Tiêu đặt song song */
        .finance-details-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .detail-box {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 1.5px solid #e2e8f0;
        }
        .detail-box-header {
            font-size: 16px;
            font-weight: 700;
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1.5px dashed #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .expense-summary {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 16px;
        }
        .expense-col.border-left {
            border-left: 1.5px dashed var(--expense-border);
            padding-left: 16px;
        }
        .expense-col.border-left-income {
            border-left: 1.5px dashed var(--income-border);
            padding-left: 16px;
        }

        .stat-list {
            font-size: 13.5px;
            color: var(--text-main);
            padding-left: 0;
            margin: 0;
        }
        .stat-list li {
            list-style-type: none;
            border-bottom: 1px dashed #e2e8f0;
            padding: 7px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .stat-list li:last-child { border-bottom: none; }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-content {
            background-color: white;
            padding: 26px 28px;
            border-radius: 24px;
            width: 100%;
            max-width: 540px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 2px solid var(--primary-bg);
        }
        .modal-content h3 {
            margin: 0 0 18px 0;
            color: var(--primary);
            text-align: center;
            font-size: 21px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-bg);
        }
        
        /* Lưới chọn ca làm việc 2 cột gọn đẹp */
        .radio-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 13.5px;
            background: #f8fafc;
        }
        .radio-group label.full-width {
            grid-column: 1 / -1;
            color: var(--text-muted);
        }
        .radio-group label:hover {
            background-color: var(--primary-bg);
            border-color: #81c784;
            color: var(--primary);
        }
        input[type="radio"], input[type="checkbox"] {
            accent-color: var(--primary-light);
            width: 17px;
            height: 17px;
            margin: 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Phần Tăng Ca */
        .overtime-section {
            background: #f8fafc;
            border: 1.5px solid var(--primary-border);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 18px;
        }
        .overtime-section label.main-ot {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 700;
            color: var(--primary);
            font-size: 14px;
        }
        .time-range-inputs {
            display: none;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed var(--primary-border);
            align-items: center;
            gap: 10px;
            font-size: 13.5px;
            font-weight: 600;
        }
        .time-range-inputs input[type="time"] {
            height: 36px;
            padding: 0 10px;
            border: 1.5px solid var(--primary-border);
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            flex: 1;
        }

        /* KHUNG NHẬP THU NHẬP, CHI TIÊU, CÔNG VIỆC ĐỒNG BỘ */
        .form-section {
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 1.5px solid transparent;
        }
        .form-section h4 {
            margin: 0 0 12px 0;
            font-size: 14.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .income-section { background: #f8fbff; border-color: var(--income-border); }
        .income-section h4 { color: var(--income); }

        .expense-section { background: #fffafb; border-color: var(--expense-border); }
        .expense-section h4 { color: var(--expense); }

        .content-section { background: #f9fef9; border-color: var(--primary-border); margin-bottom: 22px; }
        .content-section h4 { color: var(--primary); }

        /* Dòng nhập liệu thẳng hàng tuyệt đối (Không bị rớt nút Xóa) */
        .income-row, .expense-row, .task-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .income-row:last-child, .expense-row:last-child, .task-row:last-child {
            margin-bottom: 0;
        }

        .income-row input, .expense-row input, .task-row input {
            height: 38px;
            padding: 0 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 13.5px;
            outline: none;
            background: white;
            transition: border-color 0.2s;
            min-width: 0;
        }
        .income-row input[type="text"], .expense-row input[type="text"] {
            flex: 1.5;
        }
        .income-row input[type="number"], .expense-row input[type="number"] {
            flex: 1;
            font-weight: 700;
        }
        .task-row input[type="text"] {
            flex: 1;
            font-weight: 500;
        }

        .income-row input { border: 1.5px solid var(--income-border); color: var(--income); }
        .income-row input:focus { border-color: var(--income); }

        .expense-row input { border: 1.5px solid var(--expense-border); color: var(--expense); }
        .expense-row input:focus { border-color: var(--expense); }

        .task-row input { border: 1.5px solid var(--primary-border); color: var(--primary); }
        .task-row input:focus { border-color: var(--primary-light); }

        .modal-actions {
            display: flex;
            gap: 12px;
            padding-top: 8px;
        }
        .modal-actions .btn {
            flex: 1;
            height: 44px;
            font-size: 15px;
        }

        /* RESPONSIVE */
        @media (max-width: 992px) {
            .work-stat-cards { grid-template-columns: repeat(2, 1fr); }
            .finance-details-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            body { padding: 12px 8px; }
            .container { padding: 16px; border-radius: 20px; }
            .header { flex-direction: column; align-items: stretch; }
            .header-left { justify-content: space-between; }
            .controls { justify-content: space-between; }
            .controls .btn { flex: 1; font-size: 12.5px; padding: 0 10px; }
            .save-badge { width: 100%; text-align: center; order: -1; }
            .calendar { gap: 6px; }
            .day { min-height: 100px; padding: 5px; border-radius: 12px; }
            .weekday { font-size: 11.5px; padding: 6px 0; }
            .day-number { width: 24px; height: 24px; font-size: 11.5px; }
            .balance-cards { grid-template-columns: 1fr; gap: 10px; }
            .expense-summary { grid-template-columns: 1fr; }
            .expense-col.border-left, .expense-col.border-left-income {
                border-left: none;
                padding-left: 0;
                border-top: 1.5px dashed #e2e8f0;
                padding-top: 12px;
            }
            .modal-content { padding: 20px 16px; }
        }

        @media (max-width: 480px) {
            .header-left h2 { font-size: 19px; min-width: auto; }
            .calendar { gap: 4px; }
            .day { min-height: 82px; padding: 4px; border-radius: 10px; }
            .work-status-container { padding: 3px; gap: 2px; }
            .status-text { font-size: 9.5px; padding: 1px 2px; }
            .income-badge, .expense-badge { font-size: 9px; padding: 1px 3px; }
            .job-content-preview { font-size: 9.5px; padding: 2px 4px; }
            .radio-group { grid-template-columns: 1fr; }
            .work-stat-cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-val { font-size: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <button class="btn btn-icon-nav" id="btn-prev" title="Tháng trước">❮</button>
            <h2 id="month-year">Tháng 9, 2026</h2>
            <button class="btn btn-icon-nav" id="btn-next" title="Tháng sau">❯</button>
        </div>
        <div class="controls">
            <div class="save-badge" id="auto-save-status">
                ✔️ Đã tự động lưu
            </div>
            <button class="btn" onclick="document.getElementById('import-file').click()">📂 Tải file lên</button>
            <input type="file" id="import-file" style="display: none;" accept=".json">
            <button class="btn btn-primary" id="btn-export" title="Tải file dự phòng">💾 Tải bản sao lưu</button>
        </div>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="stats-panel">
        <h3>📊 Tổng kết Công việc & Tài chính (Thu - Chi)</h3>
        <div id="stats-grid">
            <!-- Dữ liệu tự động render -->
        </div>
    </div>
</div>

<!-- Hộp thoại Modal -->
<div class="modal" id="work-modal">
    <div class="modal-content">
        <h3 id="modal-date-title">🌱 Chi tiết Ngày 🌱</h3>
        
        <div class="radio-group">
            <label><input type="radio" name="work_type" value="full"> 🌳 Làm cả ngày</label>
            <label><input type="radio" name="work_type" value="off"> 🏖️ Không đi làm</label>
            <label><input type="radio" name="work_type" value="half-am"> 🌅 Nửa ngày (Sáng)</label>
            <label><input type="radio" name="work_type" value="half-pm"> 🌇 Nửa ngày (Chiều)</label>
            <label class="full-width"><input type="radio" name="work_type" value="none"> 🗑️ Chỉ ghi chú / Thu chi (Xóa ca làm)</label>
        </div>

        <div class="overtime-section" id="ot-section">
            <label class="main-ot"><input type="checkbox" id="check-overtime"> ⏰ Có làm tăng ca</label>
            <div class="time-range-inputs" id="time-range-div">
                <span>Từ</span><input type="time" id="ot-start" value="17:00">
                <span>đến</span><input type="time" id="ot-end" value="19:00">
            </div>
        </div>

        <!-- Mục Thu Nhập -->
        <div class="form-section income-section">
            <h4>
                <span>💰 Thu nhập trong ngày</span>
                <button type="button" class="btn btn-small" id="btn-add-income" style="border-color:#bbdefb; color:#1565c0;">+ Thêm khoản thu</button>
            </h4>
            <div id="income-list-container"></div>
        </div>

        <!-- Mục Chi Tiêu -->
        <div class="form-section expense-section">
            <h4>
                <span>💸 Chi tiêu trong ngày</span>
                <button type="button" class="btn btn-small" id="btn-add-expense" style="border-color:#ffcdd2; color:#c62828;">+ Thêm khoản chi</button>
            </h4>
            <div id="expense-list-container"></div>
        </div>

        <!-- Mục Công Việc / Ghi Chú -->
        <div class="form-section content-section">
            <h4>
                <span>📝 Các mục công việc / Ghi chú</span>
                <button type="button" class="btn btn-small" id="btn-add-task" style="border-color:#c8e6c9; color:#2e7d32;">+ Thêm công việc</button>
            </h4>
            <div id="task-list-container"></div>
        </div>

        <div class="modal-actions">
            <button class="btn" id="btn-cancel">Hủy bỏ</button>
            <button class="btn btn-primary" id="btn-save">Lưu lại ✔️</button>
        </div>
    </div>
</div>

<script>
    let currentDate = new Date();
    
    // Tải dữ liệu từ LocalStorage khi mới mở trang
    let savedData = localStorage.getItem('nhatky_congviec_data');
    let workData = savedData ? JSON.parse(savedData) : {}; 
    let selectedDateStr = '';

    const calendarEl = document.getElementById('calendar');
    const monthYearEl = document.getElementById('month-year');
    const modal = document.getElementById('work-modal');
    
    const radioInputs = document.querySelectorAll('input[name="work_type"]');
    const checkOvertime = document.getElementById('check-overtime');
    const otSection = document.getElementById('ot-section');
    const timeRangeDiv = document.getElementById('time-range-div');
    const otStartInput = document.getElementById('ot-start');
    const otEndInput = document.getElementById('ot-end');
    
    const incomeListContainer = document.getElementById('income-list-container');
    const btnAddIncome = document.getElementById('btn-add-income');
    const expenseListContainer = document.getElementById('expense-list-container');
    const btnAddExpense = document.getElementById('btn-add-expense');
    const taskListContainer = document.getElementById('task-list-container');
    const btnAddTask = document.getElementById('btn-add-task');

    const statsGrid = document.getElementById('stats-grid');
    const autoSaveStatus = document.getElementById('auto-save-status');

    const formatCurrency = (val) => new Intl.NumberFormat('vi-VN').format(val) + 'đ';

    // Hàm lưu vào LocalStorage
    function autoSaveData() {
        localStorage.setItem('nhatky_congviec_data', JSON.stringify(workData));
        
        autoSaveStatus.style.opacity = '0.2';
        setTimeout(() => { autoSaveStatus.style.opacity = '1'; }, 250);
    }

    // Logic Ẩn/Hiện Tăng ca
    radioInputs.forEach(radio => {
        radio.addEventListener('change', (e) => {
            if (e.target.value === 'off' || e.target.value === 'none') {
                otSection.style.opacity = '0.5'; otSection.style.pointerEvents = 'none';
                checkOvertime.checked = false; timeRangeDiv.style.display = 'none';
            } else {
                otSection.style.opacity = '1'; otSection.style.pointerEvents = 'auto';
            }
        });
    });

    checkOvertime.addEventListener('change', (e) => {
        timeRangeDiv.style.display = e.target.checked ? 'flex' : 'none';
    });

    // Quản lý các dòng THU NHẬP động
    function createIncomeRow(name = '', amount = '') {
        const row = document.createElement('div');
        row.className = 'income-row';
        row.innerHTML = `
            <input type="text" class="inc-name" placeholder="Tên khoản thu (VD: Lương, Thưởng)" value="${escapeHtml(name)}">
            <input type="number" class="inc-amount" placeholder="Số tiền" min="0" value="${amount}">
            <button type="button" class="btn btn-danger btn-remove-inc" title="Xóa">✖</button>
        `;
        row.querySelector('.btn-remove-inc').onclick = () => row.remove();
        incomeListContainer.appendChild(row);
    }
    btnAddIncome.onclick = () => createIncomeRow();

    // Quản lý các dòng CHI TIÊU động
    function createExpenseRow(name = '', amount = '') {
        const row = document.createElement('div');
        row.className = 'expense-row';
        row.innerHTML = `
            <input type="text" class="exp-name" placeholder="Tên khoản chi (VD: Ăn sáng)" value="${escapeHtml(name)}">
            <input type="number" class="exp-amount" placeholder="Số tiền" min="0" value="${amount}">
            <button type="button" class="btn btn-danger btn-remove-exp" title="Xóa">✖</button>
        `;
        row.querySelector('.btn-remove-exp').onclick = () => row.remove();
        expenseListContainer.appendChild(row);
    }
    btnAddExpense.onclick = () => createExpenseRow();

    // Quản lý các dòng CÔNG VIỆC / GHI CHÚ động
    function createTaskRow(text = '') {
        const row = document.createElement('div');
        row.className = 'task-row';
        row.innerHTML = `
            <input type="text" class="task-name" placeholder="Nhập đầu việc / ghi chú (VD: Lắp camera khu vực 1)" value="${escapeHtml(text)}">
            <button type="button" class="btn btn-danger btn-remove-task" title="Xóa">✖</button>
        `;
        row.querySelector('.btn-remove-task').onclick = () => row.remove();
        taskListContainer.appendChild(row);
    }
    btnAddTask.onclick = () => createTaskRow();

    // Hàm chuẩn hóa danh sách công việc (Tương thích mọi phiên bản dữ liệu cũ & mới)
    function getTaskList(data) {
        if (!data) return [];
        if (data.tasks && Array.isArray(data.tasks) && data.tasks.length > 0) {
            return data.tasks.map(t => {
                if (typeof t === 'string') return t.trim();
                if (t && typeof t === 'object') {
                    if (t.name && t.detail) return `${t.name}: ${t.detail}`;
                    return t.name || t.detail || '';
                }
                return '';
            }).filter(Boolean);
        }
        if (data.content && typeof data.content === 'string' && data.content.trim() !== '') {
            return data.content.split('\n').map(s => s.trim()).filter(Boolean);
        }
        return [];
    }

    // VẼ LỊCH
    function renderCalendar() {
        calendarEl.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        monthYearEl.innerHTML = `Tháng ${month + 1} <span>🌿</span> ${year}`;

        const firstDayOfMonth = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();

        const weekdays = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
        weekdays.forEach(day => {
            const div = document.createElement('div');
            div.className = 'weekday';
            div.textContent = day;
            calendarEl.appendChild(div);
        });

        for (let i = 0; i < firstDayOfMonth; i++) {
            createDayCell(year, month - 1, daysInPrevMonth - firstDayOfMonth + i + 1, true);
        }
        
        const today = new Date();
        for (let i = 1; i <= daysInMonth; i++) {
            const isToday = i === today.getDate() && month === today.getMonth() && year === today.getFullYear();
            createDayCell(year, month, i, false, isToday);
        }

        const remainder = (firstDayOfMonth + daysInMonth) % 7;
        const nextMonthDays = remainder === 0 ? 0 : 7 - remainder; 
        for (let i = 1; i <= nextMonthDays; i++) {
            createDayCell(year, month + 1, i, true);
        }

        updateStatistics(year, month, daysInMonth, firstDayOfMonth);
    }

    function createDayCell(year, month, day, isOtherMonth, isToday = false) {
        const actualDate = new Date(year, month, day);
        const y = actualDate.getFullYear();
        const m = String(actualDate.getMonth() + 1).padStart(2, '0');
        const d = String(actualDate.getDate()).padStart(2, '0');
        const dateString = `${y}-${m}-${d}`;

        const div = document.createElement('div');
        div.className = `day ${isOtherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''}`;
        
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        const dayNum = document.createElement('div');
        dayNum.className = 'day-number';
        dayNum.textContent = actualDate.getDate();
        dayHeader.appendChild(dayNum);
        div.appendChild(dayHeader);

        const data = workData[dateString];
        if (data) {
            let dailyIncomeTotal = 0;
            if (data.incomes && Array.isArray(data.incomes)) {
                dailyIncomeTotal = data.incomes.reduce((sum, item) => sum + Number(item.amount), 0);
            }

            let dailyExpenseTotal = 0;
            if (data.expenses && Array.isArray(data.expenses)) {
                dailyExpenseTotal = data.expenses.reduce((sum, item) => sum + Number(item.amount), 0);
            } else if (data.expenseAmount) {
                dailyExpenseTotal = Number(data.expenseAmount);
            }

            const taskList = getTaskList(data);

            let slotClass = '';
            if (data.type && data.type !== 'none') {
                slotClass = `slot-${data.type}`;
            } else if (dailyIncomeTotal > 0 && dailyExpenseTotal > 0) {
                slotClass = 'slot-both-only';
            } else if (dailyIncomeTotal > 0) {
                slotClass = 'slot-income-only';
            } else if (dailyExpenseTotal > 0) {
                slotClass = 'slot-expense-only';
            } else if (taskList.length > 0) {
                slotClass = 'slot-task-only';
            }

            const slotDiv = document.createElement('div');
            slotDiv.className = `work-status-container ${slotClass} ${data.isOvertime ? 'overtime' : ''}`;
            
            let html = '';

            if (dailyIncomeTotal > 0 || dailyExpenseTotal > 0) {
                html += `<div class="badges-wrap">`;
                if (dailyIncomeTotal > 0) html += `<div class="income-badge">💰 +${formatCurrency(dailyIncomeTotal)}</div>`;
                if (dailyExpenseTotal > 0) html += `<div class="expense-badge">💸 -${formatCurrency(dailyExpenseTotal)}</div>`;
                html += `</div>`;
            }

            if (data.type && data.type !== 'none') {
                let labelText = '';
                if (data.type === 'full') labelText = data.isOvertime ? '🌳 Cả ngày (+OT)' : '🌳 Cả ngày';
                else if (data.type === 'half-am') labelText = data.isOvertime ? '🌅 Sáng (+OT)' : '🌅 Ca Sáng';
                else if (data.type === 'half-pm') labelText = data.isOvertime ? '🌇 Chiều (+OT)' : '🌇 Ca Chiều';
                else if (data.type === 'off') labelText = '🏖️ Nghỉ';
                html += `<div class="status-text">${labelText}</div>`;
                
                if (data.isOvertime && data.startTime && data.endTime && data.type !== 'off') {
                    html += `<div class="ot-time-badge">⏰ ${data.startTime} - ${data.endTime}</div>`;
                }
            }

            if (taskList.length > 0) {
                const maxPreview = 2;
                let tasksHtml = taskList.slice(0, maxPreview).map(t => `<div class="job-task-item">• ${escapeHtml(t)}</div>`).join('');
                if (taskList.length > maxPreview) {
                    tasksHtml += `<div style="font-size:9.5px; color:#64748b; font-style:italic;">+${taskList.length - maxPreview} việc khác...</div>`;
                }
                html += `<div class="job-content-preview">${tasksHtml}</div>`;
            }

            slotDiv.innerHTML = html;
            div.appendChild(slotDiv);
        }

        div.onclick = () => openModal(dateString);
        calendarEl.appendChild(div);
    }

    function escapeHtml(text) {
        if (!text) return '';
        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function calculateHours(start, end) {
        if (!start || !end) return 0;
        const [h1, m1] = start.split(':').map(Number);
        const [h2, m2] = end.split(':').map(Number);
        let diff = (h2 + m2 / 60) - (h1 + m1 / 60);
        if (diff < 0) diff += 24; 
        return diff;
    }

    // THỐNG KÊ CHI TIẾT
    function updateStatistics(year, month, daysInMonth, firstDayOfMonth) {
        let stats = { full: [], halfAm: [], halfPm: [], off: [], totalOtHours: 0 };
        
        let monthlyIncome = 0;
        let weeklyIncomes = {};
        let categoryIncomes = {};

        let monthlyExpense = 0;
        let weeklyExpenses = {};
        let categoryExpenses = {};

        let monthlyTasks = [];

        for (let i = 1; i <= daysInMonth; i++) {
            const m = String(month + 1).padStart(2, '0');
            const d = String(i).padStart(2, '0');
            const dateStr = `${year}-${m}-${d}`;
            
            const weekNum = Math.floor((firstDayOfMonth + i - 1) / 7) + 1;
            if (!weeklyIncomes[`Tuần ${weekNum}`]) weeklyIncomes[`Tuần ${weekNum}`] = 0;
            if (!weeklyExpenses[`Tuần ${weekNum}`]) weeklyExpenses[`Tuần ${weekNum}`] = 0;

            const data = workData[dateStr];
            if (data) {
                if (data.type === 'full') stats.full.push(i);
                else if (data.type === 'half-am') stats.halfAm.push(i);
                else if (data.type === 'half-pm') stats.halfPm.push(i);
                else if (data.type === 'off') stats.off.push(i);

                if (data.isOvertime && data.type !== 'off' && data.type !== 'none') {
                    stats.totalOtHours += calculateHours(data.startTime, data.endTime);
                }

                // Tổng hợp Thu nhập
                let dayIncomes = (data.incomes && Array.isArray(data.incomes)) ? data.incomes : [];
                dayIncomes.forEach(inc => {
                    const amount = Number(inc.amount) || 0;
                    if (amount > 0) {
                        const name = inc.name.trim() || 'Chưa đặt tên';
                        monthlyIncome += amount;
                        weeklyIncomes[`Tuần ${weekNum}`] += amount;
                        categoryIncomes[name] = (categoryIncomes[name] || 0) + amount;
                    }
                });

                // Tổng hợp Chi tiêu
                let dayExpenses = [];
                if (data.expenses && Array.isArray(data.expenses)) dayExpenses = data.expenses;
                else if (data.expenseAmount) dayExpenses = [{ name: 'Mục khác', amount: data.expenseAmount }];

                dayExpenses.forEach(exp => {
                    const amount = Number(exp.amount) || 0;
                    if(amount > 0) {
                        const name = exp.name.trim() || 'Chưa đặt tên';
                        monthlyExpense += amount;
                        weeklyExpenses[`Tuần ${weekNum}`] += amount;
                        categoryExpenses[name] = (categoryExpenses[name] || 0) + amount;
                    }
                });

                // Tổng hợp Công việc trong tháng
                const dayTasks = getTaskList(data);
                dayTasks.forEach(taskText => {
                    monthlyTasks.push({ day: `${d}/${m}`, text: taskText });
                });
            }
        }

        const createStatHTML = (icon, title, count, suffix) => `
            <div class="stat-item">
                <div class="stat-title">${icon} ${title}</div>
                <div class="stat-val">${count} <span style="font-size:15px; font-weight:600; color:#64748b;">${suffix}</span></div>
            </div>
        `;

        let workCardsHTML = `
            <div class="work-stat-cards">
                ${createStatHTML('🌳', 'Làm cả ngày', stats.full.length, 'ngày')}
                ${createStatHTML('🌅', 'Làm nửa ngày', stats.halfAm.length + stats.halfPm.length, 'ngày')}
                ${createStatHTML('🏖️', 'Không đi làm', stats.off.length, 'ngày')}
                ${createStatHTML('⏰', 'Tổng Tăng ca', parseFloat(stats.totalOtHours.toFixed(2)), 'giờ')}
            </div>
        `;

        // BẢNG TỔNG KẾT THU CHI: TỔNG = THU NHẬP - CHI TIÊU
        const netBalance = monthlyIncome - monthlyExpense;
        const balanceColor = netBalance >= 0 ? '#2e7d32' : '#c62828';
        const balanceBg = netBalance >= 0 ? '#f1f8e9' : '#fff5f5';
        const balanceSign = netBalance > 0 ? '+' : '';

        let balanceSummaryHTML = `
            <div class="balance-box">
                <div class="balance-header">
                    ⚖️ Bảng Tổng Kết Tài Chính Tháng ${month + 1}/${year} (Thu Nhập - Chi Tiêu)
                </div>
                <div class="balance-cards">
                    <div class="balance-card" style="border: 1.5px solid #bbdefb;">
                        <div style="font-size: 13px; color: #1565c0; font-weight: 700;">💰 TỔNG THU NHẬP</div>
                        <div style="font-size: 21px; font-weight: 700; color: #1565c0; margin-top: 6px;">+${formatCurrency(monthlyIncome)}</div>
                    </div>
                    <div class="balance-card" style="border: 1.5px solid #ffcdd2;">
                        <div style="font-size: 13px; color: #c62828; font-weight: 700;">💸 TỔNG CHI TIÊU</div>
                        <div style="font-size: 21px; font-weight: 700; color: #c62828; margin-top: 6px;">-${formatCurrency(monthlyExpense)}</div>
                    </div>
                    <div class="balance-card" style="border: 2px solid ${balanceColor}; background: ${balanceBg};">
                        <div style="font-size: 13px; color: ${balanceColor}; font-weight: 700;">✨ CÒN LẠI (THU - CHI)</div>
                        <div style="font-size: 22px; font-weight: 700; color: ${balanceColor}; margin-top: 6px;">${balanceSign}${formatCurrency(netBalance)}</div>
                    </div>
                </div>
            </div>
        `;

        // Render chi tiết THU NHẬP
        let weekIncHTML = `<ul class="stat-list">`;
        let hasWeekInc = false;
        for (let week in weeklyIncomes) {
            if (weeklyIncomes[week] > 0) {
                weekIncHTML += `<li><span>${week}</span> <strong style="color:#1565c0;">+${formatCurrency(weeklyIncomes[week])}</strong></li>`;
                hasWeekInc = true;
            }
        }
        if(!hasWeekInc) weekIncHTML += `<span style="color:#94a3b8; font-style:italic; font-size:13px;">Chưa có khoản thu nào</span>`;
        weekIncHTML += `</ul>`;

        let catIncHTML = `<ul class="stat-list">`;
        let hasCatInc = false;
        const sortedIncCats = Object.entries(categoryIncomes).sort((a, b) => b[1] - a[1]);
        for (let [cat, amount] of sortedIncCats) {
            catIncHTML += `<li><span>🏷️ ${escapeHtml(cat)}</span> <strong style="color:#1565c0;">+${formatCurrency(amount)}</strong></li>`;
            hasCatInc = true;
        }
        if(!hasCatInc) catIncHTML += `<span style="color:#94a3b8; font-style:italic; font-size:13px;">Chưa có khoản thu nào</span>`;
        catIncHTML += `</ul>`;

        // Render chi tiết CHI TIÊU
        let weekExpHTML = `<ul class="stat-list">`;
        let hasWeekExp = false;
        for (let week in weeklyExpenses) {
            if (weeklyExpenses[week] > 0) {
                weekExpHTML += `<li><span>${week}</span> <strong style="color:#c62828;">-${formatCurrency(weeklyExpenses[week])}</strong></li>`;
                hasWeekExp = true;
            }
        }
        if(!hasWeekExp) weekExpHTML += `<span style="color:#94a3b8; font-style:italic; font-size:13px;">Chưa có khoản chi nào</span>`;
        weekExpHTML += `</ul>`;

        let catExpHTML = `<ul class="stat-list">`;
        let hasCatExp = false;
        const sortedExpCats = Object.entries(categoryExpenses).sort((a, b) => b[1] - a[1]);
        for (let [cat, amount] of sortedExpCats) {
            catExpHTML += `<li><span>🏷️ ${escapeHtml(cat)}</span> <strong style="color:#c62828;">-${formatCurrency(amount)}</strong></li>`;
            hasCatExp = true;
        }
        if(!hasCatExp) catExpHTML += `<span style="color:#94a3b8; font-style:italic; font-size:13px;">Chưa có khoản chi nào</span>`;
        catExpHTML += `</ul>`;

        let financeDetailsHTML = `
            <div class="finance-details-grid">
                <div class="detail-box" style="border-color:#bbdefb; background:#f8fbff;">
                    <div class="detail-box-header" style="color:#1565c0; border-color:#bbdefb;">
                        <span>💰 CHI TIẾT THU NHẬP</span>
                        <span style="font-size:18px;">+${formatCurrency(monthlyIncome)}</span>
                    </div>
                    <div class="expense-summary">
                        <div class="expense-col">
                            <strong style="color:#1976d2; display:block; margin-bottom:8px; font-size:13.5px;">📅 Theo Tuần:</strong>
                            ${weekIncHTML}
                        </div>
                        <div class="expense-col border-left-income">
                            <strong style="color:#1976d2; display:block; margin-bottom:8px; font-size:13.5px;">📥 Phân loại Nguồn thu:</strong>
                            ${catIncHTML}
                        </div>
                    </div>
                </div>

                <div class="detail-box" style="border-color:#ffcdd2; background:#fffafb;">
                    <div class="detail-box-header" style="color:#c62828; border-color:#ffcdd2;">
                        <span>💸 CHI TIẾT CHI TIÊU</span>
                        <span style="font-size:18px;">-${formatCurrency(monthlyExpense)}</span>
                    </div>
                    <div class="expense-summary">
                        <div class="expense-col">
                            <strong style="color:#d32f2f; display:block; margin-bottom:8px; font-size:13.5px;">📅 Theo Tuần:</strong>
                            ${weekExpHTML}
                        </div>
                        <div class="expense-col border-left">
                            <strong style="color:#d32f2f; display:block; margin-bottom:8px; font-size:13.5px;">🛒 Phân loại Hạng mục chi:</strong>
                            ${catExpHTML}
                        </div>
                    </div>
                </div>
            </div>
        `;

        // Render danh sách công việc trong tháng
        let taskSummaryHTML = `<ul class="stat-list">`;
        if (monthlyTasks.length > 0) {
            monthlyTasks.forEach(item => {
                taskSummaryHTML += `
                    <li>
                        <span style="font-weight:700; color:#2e7d32; white-space:nowrap;">🗓️ Ngày ${item.day}</span>
                        <span style="flex:1; text-align:right; color:#334155; font-weight:500;">${escapeHtml(item.text)}</span>
                    </li>
                `;
            });
        } else {
            taskSummaryHTML += `<span style="color:#94a3b8; font-style:italic; font-size:13px;">Chưa có ghi chú công việc nào trong tháng</span>`;
        }
        taskSummaryHTML += `</ul>`;

        let taskBoxHTML = `
            <div class="detail-box" style="border-color:#c8e6c9; background:#f9fef9;">
                <div class="detail-box-header" style="color:#2e7d32; border-color:#c8e6c9;">
                    <span>📝 TỔNG HỢP CÔNG VIỆC / GHI CHÚ TRONG THÁNG</span>
                    <span style="font-size:14px; background:#e8f5e9; padding:3px 10px; border-radius:12px;">${monthlyTasks.length} đầu việc</span>
                </div>
                ${taskSummaryHTML}
            </div>
        `;

        statsGrid.innerHTML = workCardsHTML + balanceSummaryHTML + financeDetailsHTML + taskBoxHTML;
    }

    // MỞ MODAL
    function openModal(dateStr) {
        selectedDateStr = dateStr;
        const [y, m, d] = dateStr.split('-');
        document.getElementById('modal-date-title').innerHTML = `🌱 Chi tiết Ngày ${d}/${m}/${y} 🌱`;
        
        document.querySelectorAll('input[name="work_type"]').forEach(r => r.checked = false);
        checkOvertime.checked = false; timeRangeDiv.style.display = 'none';
        otStartInput.value = '17:00'; otEndInput.value = '19:00';
        incomeListContainer.innerHTML = '';
        expenseListContainer.innerHTML = ''; 
        taskListContainer.innerHTML = '';
        otSection.style.opacity = '1'; otSection.style.pointerEvents = 'auto';

        const data = workData[dateStr];
        if (data) {
            if(data.type) document.querySelector(`input[value="${data.type}"]`).checked = true;
            else document.querySelector('input[value="none"]').checked = true;

            if (data.type === 'off' || data.type === 'none') {
                otSection.style.opacity = '0.5'; otSection.style.pointerEvents = 'none';
            }
            if (data.isOvertime) {
                checkOvertime.checked = true; timeRangeDiv.style.display = 'flex';
                if (data.startTime) otStartInput.value = data.startTime;
                if (data.endTime) otEndInput.value = data.endTime;
            }
            
            // Load danh sách Thu nhập
            if (data.incomes && Array.isArray(data.incomes) && data.incomes.length > 0) {
                data.incomes.forEach(inc => createIncomeRow(inc.name, inc.amount));
            } else {
                createIncomeRow();
            }

            // Load danh sách Chi tiêu
            if (data.expenses && Array.isArray(data.expenses) && data.expenses.length > 0) {
                data.expenses.forEach(exp => createExpenseRow(exp.name, exp.amount));
            } else if (data.expenseAmount) {
                createExpenseRow('Mục khác', data.expenseAmount);
            } else {
                createExpenseRow();
            }

            // Load danh sách Công việc / Ghi chú
            const taskList = getTaskList(data);
            if (taskList.length > 0) {
                taskList.forEach(task => createTaskRow(task));
            } else {
                createTaskRow();
            }
        } else {
            document.querySelector('input[value="full"]').checked = true;
            createIncomeRow();
            createExpenseRow();
            createTaskRow();
        }
        
        modal.style.display = 'flex';
    }

    document.getElementById('btn-cancel').onclick = () => { modal.style.display = 'none'; };
    
    // LƯU DATA
    document.getElementById('btn-save').onclick = () => {
        const typeRadio = document.querySelector('input[name="work_type"]:checked');
        const selectedType = typeRadio ? typeRadio.value : 'none';
        
        const incomes = [];
        document.querySelectorAll('.income-row').forEach(row => {
            const name = row.querySelector('.inc-name').value.trim();
            const amount = row.querySelector('.inc-amount').value.trim();
            if (amount && Number(amount) > 0) {
                incomes.push({ name: name || 'Khoản thu khác', amount: Number(amount) });
            }
        });

        const expenses = [];
        document.querySelectorAll('.expense-row').forEach(row => {
            const name = row.querySelector('.exp-name').value.trim();
            const amount = row.querySelector('.exp-amount').value.trim();
            if (amount && Number(amount) > 0) {
                expenses.push({ name: name || 'Khoản chi khác', amount: Number(amount) });
            }
        });

        const tasks = [];
        document.querySelectorAll('.task-row').forEach(row => {
            const taskText = row.querySelector('.task-name').value.trim();
            if (taskText !== '') {
                tasks.push(taskText);
            }
        });

        if (selectedType === 'none' && incomes.length === 0 && expenses.length === 0 && tasks.length === 0) {
            delete workData[selectedDateStr];
        } else {
            const isOff = (selectedType === 'off' || selectedType === 'none');
            workData[selectedDateStr] = { 
                type: selectedType,
                isOvertime: isOff ? false : checkOvertime.checked,
                startTime: (checkOvertime.checked && !isOff) ? otStartInput.value : '',
                endTime: (checkOvertime.checked && !isOff) ? otEndInput.value : '',
                incomes: incomes,
                expenses: expenses,
                tasks: tasks,
                content: tasks.join('\n') // Lưu kèm chuỗi để tương thích ngược
            };
        }
        
        autoSaveData();
        modal.style.display = 'none';
        renderCalendar();
    };

    document.getElementById('btn-prev').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
    document.getElementById('btn-next').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };

    // TẢI FILE VỀ MÁY (Backup)
    document.getElementById('btn-export').onclick = () => {
        if (Object.keys(workData).length === 0) { alert("Lịch đang trống!"); return; }
        const dataStr = JSON.stringify(workData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url;
        a.download = `nhatky_congviec_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    };

    // TẢI FILE LÊN VÀ LƯU VÀO TRÌNH DUYỆT
    document.getElementById('import-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const importedData = JSON.parse(event.target.result);
                workData = { ...workData, ...importedData }; 
                
                autoSaveData();
                renderCalendar();
                alert("Tải dữ liệu thành công rồi nha! 🎉");
            } catch (error) { alert("Lỗi! File không hợp lệ."); }
        };
        reader.readAsText(file); e.target.value = '';
    });

    // Đóng Modal khi bấm ra ngoài vùng tối
    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
    });

    renderCalendar();
</script>
</body>
</html>
